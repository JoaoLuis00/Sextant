[package]
name = "sextant"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls", "query"], optional = true }
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }
rust_decimal = { version = "1.42.1", features = ["macros"] }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.151", optional = true }
thiserror = "2.0.20"


[dependencies.uuid]
version = "1.24.0"
features = [
    "v5",
    "v7",
]

[features]
storage = ["dep:rusqlite"]
market_data = ["dep:reqwest", "dep:serde", "dep:serde_json"]
