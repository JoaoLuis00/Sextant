[package]
name = "sextant"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }
rust_decimal = { version = "1.42.1", features = ["macros"] }
thiserror = "2.0.20"


[dependencies.uuid]
version = "1.24.0"
features = [
    "v7",
]

[features]
storage = ["dep:rusqlite"]
